version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/bsu_queue
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bsu_queue
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host - only `backend` and `worker` need it, and they
    # reach it over the internal compose network as `db:5432`. Add a `ports`
    # mapping back temporarily if you need to inspect it with a local client.

  redis:
    image: redis:7-alpine
    # Internal-only, same reasoning as `db` above (reachable as `redis:6379`).

  worker:
    build: ./backend
    command: celery -A app.worker worker --beat --loglevel=info -Q celery,notifications
    depends_on:
      - redis
      - db

volumes:
  postgres_data: