server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    # Don't advertise the nginx version.
    server_tokens off;

    # HTTPS everywhere: TLS is terminated by the platform proxy in front of
    # this container, which forwards the original scheme in X-Forwarded-Proto.
    # Bounce any plain-HTTP request to HTTPS. No redirect loop: once the proxy
    # serves the request over TLS this header is "https" and the block is
    # skipped. (In local `docker compose` there is no such proxy, so the
    # header is empty and this is a no-op.)
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Vue Router runs in history mode - any path that isn't a real file
    # falls back to index.html so client-side routing can take over.
    location / {
        try_files $uri $uri/ /index.html;

        # Security headers for the SPA and its assets (the API responses under
        # /api/ carry their own set from the FastAPI middleware). "always" so
        # they apply to error responses too.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # The QR check-in screen needs the camera; nothing else uses these APIs.
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
        # Google Fonts is the only off-origin dependency. 'unsafe-inline' for
        # styles covers Vue :style bindings, chart.js canvas sizing and the
        # qr-scanner overlay; scripts stay strict ('self' only).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' blob: https:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    }

    # Reverse-proxied to the backend container so the API is never
    # exposed on its own public port - it's only reachable through
    # this same origin, under /api.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
