server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    # Vue Router runs in history mode - any path that isn't a real file
    # falls back to index.html so client-side routing can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxied to the backend container so the API is never
    # exposed on its own public port - it's only reachable through
    # this same origin, under /api.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
