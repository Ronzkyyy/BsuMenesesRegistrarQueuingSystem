name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # The test suite runs against the dev posture (see tests/test_security_headers.py);
      # locally that comes from backend/.env, which doesn't exist in CI. Without this,
      # config.py's fail-fast (placeholder SECRET_KEY + DEBUG=False) aborts collection.
      DEBUG: "True"
    defaults:
      run:
        working-directory: bsu-registrar-queue/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: bsu-registrar-queue/backend/requirements.txt

      - run: pip install -r requirements.txt

      # Fail the build on a known-vulnerable dependency. PYSEC-2026-1325 is an
      # ECDSA-signing timing side-channel in `ecdsa` (pulled in by python-jose)
      # with no upstream fix planned; this app only issues HS256 (HMAC) tokens,
      # so that code path is never executed. Revisit if auth moves to PyJWT.
      - run: pip install pip-audit
      - run: pip-audit --ignore-vuln PYSEC-2026-1325

      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bsu-registrar-queue/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: bsu-registrar-queue/frontend/package-lock.json

      - run: npm ci

      # Audit the dependencies that actually ship in the built bundle. Build
      # tooling (vite/esbuild) lives in devDependencies and is excluded - its
      # advisories are dev-server only and tracked via Dependabot PRs.
      - run: npm audit --omit=dev --audit-level=high

      - run: npm test
