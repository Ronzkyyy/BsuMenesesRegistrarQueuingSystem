version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/bsu-registrar-queue/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/bsu-registrar-queue/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/bsu-registrar-queue/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/bsu-registrar-queue/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
